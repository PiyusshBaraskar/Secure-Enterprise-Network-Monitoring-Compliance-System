<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - SOC Portal'">SOC Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    
    <th:block th:replace="${extraHeaders} ?: ~{}"></th:block>
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <span>SECURE SOC</span>
            </div>
            
            <ul class="sidebar-menu">
                <li class="sidebar-item" th:classappend="${#request.requestURI == '/' or #request.requestURI == '/dashboard'} ? 'active'">
                    <a th:href="@{/dashboard}">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/devices')} ? 'active'" sec:authorize="hasAnyAuthority('READ_DASHBOARD', 'MANAGE_DEVICES')">
                    <a th:href="@{/devices}">
                        <i class="fa-solid fa-server"></i>
                        <span>Devices</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/scans')} ? 'active'" sec:authorize="hasAnyAuthority('RUN_SCANS', 'READ_DASHBOARD')">
                    <a th:href="@{/scans}">
                        <i class="fa-solid fa-radar"></i>
                        <span>Discovery Scans</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/alerts')} ? 'active'" sec:authorize="hasAnyAuthority('VIEW_ALERTS', 'READ_DASHBOARD')">
                    <a th:href="@{/alerts}">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>Security Alerts</span>
                        <span class="badge bg-danger rounded-pill ms-auto" 
                              th:if="${criticalAlertsCount > 0}" 
                              th:text="${criticalAlertsCount}">0</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/logs')} ? 'active'" sec:authorize="hasAnyAuthority('VIEW_LOGS', 'READ_DASHBOARD')">
                    <a th:href="@{/logs}">
                        <i class="fa-solid fa-terminal"></i>
                        <span>System Logs</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/compliance')} ? 'active'" sec:authorize="hasAnyAuthority('RUN_AUDITS', 'READ_DASHBOARD')">
                    <a th:href="@{/compliance}">
                        <i class="fa-solid fa-clipboard-check"></i>
                        <span>Compliance Checks</span>
                    </a>
                </li>
                
                <li class="sidebar-item" th:classappend="${#request.requestURI.startsWith('/reports')} ? 'active'" sec:authorize="hasAnyAuthority('GENERATE_REPORTS', 'READ_DASHBOARD')">
                    <a th:href="@{/reports}">
                        <i class="fa-solid fa-file-invoice"></i>
                        <span>Audit Reports</span>
                    </a>
                </li>
            </ul>
            
            <!-- Authenticated User Panel -->
            <div class="sidebar-user" sec:authorize="isAuthenticated()">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role" sec:authentication="principal.authorities[0].authority">ROLE</div>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger mt-2 w-100 py-1">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>Logout
                </a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Dynamic Notification Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 bg-success text-white mb-4" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${successMessage}">Success!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 bg-danger text-white mb-4" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <span th:text="${errorMessage}">Error!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Page Specific Content -->
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="${extraScripts} ?: ~{}"></th:block>
</body>
</html>

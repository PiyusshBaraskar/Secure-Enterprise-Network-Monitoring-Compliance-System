<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Enterprise Portal - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="login-wrapper">

    <div class="login-card">
        <div class="login-card-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <span>SECURE SOC</span>
        </div>
        
        <h5 class="text-center text-white mb-4 fw-light">Enterprise Network Monitoring Portal</h5>

        <!-- Success/Error Feedback -->
        <div th:if="${error}" class="alert alert-danger border-0 bg-danger text-white mb-3" style="font-size: 0.85rem;">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <span th:text="${error}">Error details</span>
        </div>
        <div th:if="${message}" class="alert alert-success border-0 bg-success text-white mb-3" style="font-size: 0.85rem;">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${message}">Message details</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label text-muted" style="font-size: 0.85rem;">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-regular fa-user"></i></span>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-muted" style="font-size: 0.85rem;">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-soc-primary w-100 py-2.5">
                <i class="fa-solid fa-shield me-2"></i>AUTHENTICATE
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary">
            <div class="text-center text-muted mb-2 fw-semibold" style="font-size: 0.75rem;">DEMO ACCOUNT ACCESS CREDENTIALS:</div>
            
            <div class="d-flex flex-column gap-2 text-muted" style="font-size: 0.75rem;">
                <div class="bg-dark p-2 rounded border border-secondary d-flex justify-content-between">
                    <span><strong>Admin:</strong> admin</span>
                    <span><strong>Password:</strong> password123</span>
                </div>
                <div class="bg-dark p-2 rounded border border-secondary d-flex justify-content-between">
                    <span><strong>Analyst:</strong> analyst</span>
                    <span><strong>Password:</strong> password123</span>
                </div>
                <div class="bg-dark p-2 rounded border border-secondary d-flex justify-content-between">
                    <span><strong>Auditor:</strong> auditor</span>
                    <span><strong>Password:</strong> password123</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: page('System Error', ~{::content})}">
<body>

    <div th:fragment="content">
        <div class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
            <div class="soc-card text-center glow-yellow" style="max-width: 600px;">
                <div class="mb-4">
                    <i class="fa-solid fa-bug fa-5x text-warning" style="text-shadow: 0 0 20px var(--accent-yellow-glow);"></i>
                </div>
                
                <h1 class="text-white fw-bold mb-3">SYSTEM EXCEPTION</h1>
                
                <p class="text-muted mb-4">
                    An unexpected system exception occurred during request execution. The SOC telemetry engine recorded this event.
                </p>

                <div class="bg-dark p-3 rounded border border-secondary text-start mb-4" style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;">
                    <div><strong>Error Level:</strong> HTTP <span th:text="${status} ?: '500'">500</span> (<span th:text="${error} ?: 'Internal Server Error'">Internal Server Error</span>)</div>
                    <div><strong>Request URI:</strong> <span th:text="${url} ?: 'Unknown'">/</span></div>
                    <div class="mt-2 text-warning"><strong>Message:</strong> <span th:text="${message} ?: 'No message details available.'">Details</span></div>
                </div>

                <a th:href="@{/dashboard}" class="btn btn-soc-primary">
                    <i class="fa-solid fa-house me-2"></i>Return to Dashboard
                </a>
            </div>
        </div>
    </div>

</body>
</html>

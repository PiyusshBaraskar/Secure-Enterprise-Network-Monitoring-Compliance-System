# ===================================================================
# SPRING BOOT CONFIGURATION - SECURE ENTERPRISE NETWORK MONITOR
# ===================================================================

# Application details
spring.application.name=secure-network-monitor
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
# Default to H2 for zero-configuration startup, but configured for easy MySQL swap
# To use MySQL: uncomment MySQL section and comment H2 section, or run with -Dspring.profiles.active=mysql

# Active profiles: default uses in-memory H2 database for out-of-the-box operation.
# Change to 'mysql' to connect to a real MySQL instance.
spring.profiles.active=default

# --- H2 Database Configuration (Default) ---
spring.datasource.url=jdbc:h2:mem:security_monitor_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- JPA/Hibernate Settings for H2 ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# SECURITY & SESSIONS
# ===================================================================
# Session timeout
server.servlet.session.timeout=30m
# Enable H2 console frame access (Spring Security requires this)
spring.headers.frame-options.same-origin=true

# ===================================================================
# THYMELEAF CONFIGURATION
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.com.enterprise.security.monitor=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Write logs to a file to simulate log monitoring of the application itself
logging.file.name=logs/app-security-monitor.log

# ===================================================================
# FILE UPLOAD & REPORTS DIRECTORY
# ===================================================================
# Local folder where daily/weekly/monthly reports are generated
app.reports.dir=C:/Users/TUF GAMING/.gemini/antigravity-ide/scratch/secure-network-monitor/reports
